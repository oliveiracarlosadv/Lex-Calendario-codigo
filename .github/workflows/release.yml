name: Release (Windows, macOS, Linux)

# Gera os instaladores "baixar e dar dois cliques" e publica em Releases.
# Dispare criando uma tag (git tag v1.0.0 && git push --tags) ou pela aba Actions.
#
# O aplicativo desktop roda em MODO LOCAL: banco embutido (PGlite), sem conta e sem configuração.
# Opcional — para habilitar "Entrar com Google/Microsoft" (sincronização de agenda), cadastre em
# Settings > Secrets and variables > Actions:
#   Variables: GOOGLE_CLIENT_ID, MICROSOFT_CLIENT_ID   ·   Secrets: GOOGLE_CLIENT_SECRET
# (Google: cliente OAuth do tipo "App para computador"; Microsoft: plataforma "Aplicativos móveis e da área de trabalho"
#  com redirecionamento http://127.0.0.1:47830/api/integrations/<provedor>/callback)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

# Os arquivos passam de uma etapa para a outra pela própria release (em rascunho até o fim),
# sem usar o armazenamento de artefatos do Actions, que tem cota pequena.

jobs:
  web:
    name: Build web (Next.js standalone)
    runs-on: ubuntu-latest
    env:
      NEXT_OUTPUT: standalone
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:47830
      NEXT_PUBLIC_LEX_LOCAL: "1"
      NEXT_PUBLIC_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:47830/local
      NEXT_PUBLIC_SUPABASE_ANON_KEY: lex-local
      NEXT_PUBLIC_FULLCALENDAR_LICENSE_KEY: ${{ vars.NEXT_PUBLIC_FULLCALENDAR_LICENSE_KEY }}
      # Assinaturas: endereço (https://…) do servidor de assinaturas. Vazio = aplicativo livre, sem login.
      NEXT_PUBLIC_LICENSE_SERVER: ${{ vars.LICENSE_SERVER_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Montar payload
        run: |
          mkdir -p payload/app
          cp -R .next/standalone/. payload/app/
          mkdir -p payload/app/.next
          cp -R .next/static payload/app/.next/static
          cp -R public payload/app/public
          # Banco embutido (PGlite): inclui WASM e extensões
          mkdir -p payload/app/node_modules/@electric-sql
          rm -rf payload/app/node_modules/@electric-sql/pglite
          cp -R node_modules/@electric-sql/pglite payload/app/node_modules/@electric-sql/pglite
      - name: Guardar payload na release (rascunho)
        run: |
          set -e
          tar -czf payload-app.tar.gz -C payload .
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --draft --title "Lex Calendário $VERSION" --notes "Em preparação."
          gh release upload "$VERSION" payload-app.tar.gz --clobber

  windows-linux:
    name: Windows e Linux
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Baixar payload
        run: |
          set -e
          gh release download "$VERSION" -p payload-app.tar.gz
          mkdir -p payload-app && tar -xzf payload-app.tar.gz -C payload-app && rm payload-app.tar.gz
      - uses: actions/setup-go@v5
        with: { go-version: '1.22', cache: false }

      - name: Windows (.exe com ícone)
        working-directory: desktop
        run: |
          set -e
          go install github.com/tc-hib/go-winres@latest
          V="${VERSION#v}"
          "$(go env GOPATH)/bin/go-winres" simply --arch amd64 --icon ../public/icon-512.png --manifest gui \
            --product-name "Lex Calendário" --file-description "Lex Calendário" --original-filename "Lex Calendário.exe" \
            --product-version "$V" --file-version "$V" --copyright "Carlos Alexandre Albuquerque Oliveira"
          OUT="out/win/Lex Calendário"
          mkdir -p "$OUT/payload"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$V -X main.googleClientID=${{ vars.GOOGLE_CLIENT_ID }} -X main.googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} -X main.microsoftClientID=${{ vars.MICROSOFT_CLIENT_ID }}" -o "$OUT/Lex Calendário.exe" .
          cp -R ../payload-app/. "$OUT/payload/"
          ./scripts/fetch-node.sh win-x64 "$OUT/payload/runtime"
          sudo apt-get install -y -qq icoutils >/dev/null
          for s in 16 32 48 256; do convert ../public/icon-512.png -resize ${s}x${s} "out/ico-$s.png" 2>/dev/null || true; done
          icotool -c -o "$OUT/lex-calendario.ico" out/ico-*.png || true
          cp packaging/LEIA-ME-Windows.txt "$OUT/LEIA-ME.txt"
          cp packaging/Desinstalar-Lex-Calendario.cmd "$OUT/Desinstalar Lex Calendário.cmd"
          (cd out/win && zip -qr ../../../LexCalendario-Windows.zip "Lex Calendário")
          # Instalador com assistente (NSIS)
          sudo apt-get install -y -qq nsis >/dev/null
          ICON_ARGS=(); [ -f "$OUT/lex-calendario.ico" ] && ICON_ARGS=("-DICON=$PWD/$OUT/lex-calendario.ico")
          makensis -V2 -DAPPVER="$V" -DSRC="$PWD/$OUT" -DOUTFILE="$PWD/../LexCalendario-Instalador-Windows.exe" "${ICON_ARGS[@]}" packaging/windows/lex-calendario.nsi

      - name: Linux
        working-directory: desktop
        run: |
          set -e
          rm -f *.syso
          V="${VERSION#v}"
          OUT="out/linux/Lex Calendário"
          mkdir -p "$OUT/payload"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$V -X main.googleClientID=${{ vars.GOOGLE_CLIENT_ID }} -X main.googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} -X main.microsoftClientID=${{ vars.MICROSOFT_CLIENT_ID }}" -o "$OUT/Lex Calendário" .
          cp -R ../payload-app/. "$OUT/payload/"
          ./scripts/fetch-node.sh linux-x64 "$OUT/payload/runtime"
          cp ../public/icon-512.png "$OUT/lex-calendario.png"
          cp packaging/LEIA-ME-Linux.txt "$OUT/LEIA-ME.txt"
          cp packaging/desinstalar.sh "$OUT/Desinstalar Lex Calendário.sh" && chmod +x "$OUT/Desinstalar Lex Calendário.sh"
          tar -czf ../LexCalendario-Linux.tar.gz -C out/linux "Lex Calendário"

      - name: Linux (.deb — instalar com dois cliques)
        working-directory: desktop
        run: |
          set -e
          V="${VERSION#v}"
          DEB=out/deb
          mkdir -p "$DEB/DEBIAN" "$DEB/opt/lex-calendario" "$DEB/usr/share/applications" "$DEB/usr/share/icons/hicolor/512x512/apps"
          cp -R "out/linux/Lex Calendário/." "$DEB/opt/lex-calendario/"
          rm -f "$DEB/opt/lex-calendario/LEIA-ME.txt" "$DEB/opt/lex-calendario/Desinstalar Lex Calendário.sh"
          sed "s/__VERSION__/$V/" packaging/linux-deb/control > "$DEB/DEBIAN/control"
          echo "Installed-Size: $(du -sk "$DEB/opt" | cut -f1)" >> "$DEB/DEBIAN/control"
          install -m 755 packaging/linux-deb/postinst packaging/linux-deb/postrm "$DEB/DEBIAN/"
          install -m 644 packaging/linux-deb/lex-calendario.desktop "$DEB/usr/share/applications/"
          install -m 644 ../public/icon-512.png "$DEB/usr/share/icons/hicolor/512x512/apps/lex-calendario.png"
          dpkg-deb --root-owner-group -Zxz --build "$DEB" ../LexCalendario-Instalador-Linux.deb
          dpkg-deb --info ../LexCalendario-Instalador-Linux.deb
          # Teste: instala o .deb neste computador do GitHub e confere os arquivos
          sudo dpkg -i ../LexCalendario-Instalador-Linux.deb
          test -x "/opt/lex-calendario/Lex Calendário"
          test "$("/opt/lex-calendario/Lex Calendário" --versao)" = "$V"
          test -f /usr/share/applications/lex-calendario.desktop
          sudo dpkg -r lex-calendario

      - name: Enviar instaladores para a release
        run: gh release upload "$VERSION" LexCalendario-Windows.zip LexCalendario-Instalador-Windows.exe LexCalendario-Linux.tar.gz LexCalendario-Instalador-Linux.deb --clobber

  windows-installer:
    name: Windows (testar o instalador)
    needs: windows-linux
    runs-on: windows-latest
    steps:
      - name: Instalar sem perguntas e conferir
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download "$env:VERSION" -p LexCalendario-Instalador-Windows.exe
          Start-Process .\LexCalendario-Instalador-Windows.exe -ArgumentList '/S' -Wait
          $docs = [Environment]::GetFolderPath('MyDocuments')
          $marker = Join-Path $docs 'Lex Calendário\.lex-instalado'
          if (-not (Test-Path -LiteralPath $marker)) { throw "o Lex não foi instalado em $docs" }
          $v = (Get-Content -LiteralPath $marker -Raw).Trim()
          if ($v -ne $env:VERSION.TrimStart('v')) { throw "versão instalada $v" }
          Write-Host "Instalado: versão $v em $docs\Lex Calendário"

  macos:
    name: macOS (${{ matrix.label }})
    needs: web
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - { arch: arm64, label: AppleSilicon }
          - { arch: x64, label: Intel }
    steps:
      - uses: actions/checkout@v5
      - name: Baixar payload
        run: |
          set -e
          gh release download "$VERSION" -p payload-app.tar.gz
          mkdir -p payload-app && tar -xzf payload-app.tar.gz -C payload-app && rm payload-app.tar.gz
      - uses: actions/setup-go@v5
        with: { go-version: '1.22', cache: false }

      - name: Lex Calendário.app
        working-directory: desktop
        run: |
          set -e
          V="${VERSION#v}"
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$V -X main.googleClientID=${{ vars.GOOGLE_CLIENT_ID }} -X main.googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} -X main.microsoftClientID=${{ vars.MICROSOFT_CLIENT_ID }}" -o out/lex-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$V -X main.googleClientID=${{ vars.GOOGLE_CLIENT_ID }} -X main.googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} -X main.microsoftClientID=${{ vars.MICROSOFT_CLIENT_ID }}" -o out/lex-amd64 .

          APP="out/mac/Lex Calendário.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/payload"
          lipo -create -output "$APP/Contents/MacOS/LexCalendario" out/lex-arm64 out/lex-amd64
          # Notificador nativo (Central de Notificações como "Lex Calendário")
          swiftc -O -target arm64-apple-macos11 -o out/notifier-arm64 macos/LexNotifier.swift
          swiftc -O -target x86_64-apple-macos11 -o out/notifier-x64 macos/LexNotifier.swift
          lipo -create -output "$APP/Contents/MacOS/LexNotifier" out/notifier-arm64 out/notifier-x64
          sed "s/__VERSION__/$V/g" packaging/Info.plist > "$APP/Contents/Info.plist"
          cp -R ../payload-app/. "$APP/Contents/Resources/payload/"
          ./scripts/fetch-node.sh darwin-${{ matrix.arch }} "$APP/Contents/Resources/payload/runtime"

          ICONSET=out/AppIcon.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s ../public/icon-512.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d ../public/icon-512.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          codesign --force --deep --sign - "$APP"
          cp packaging/LEIA-ME-macOS.txt out/mac/LEIA-ME.txt
          cp "packaging/Desinstalar Lex Calendário.command" out/mac/ && chmod +x "out/mac/Desinstalar Lex Calendário.command"
          (cd out/mac && ditto -c -k --keepParent "Lex Calendário.app" "../../../LexCalendario-macOS-${{ matrix.label }}.zip" && zip -q "../../../LexCalendario-macOS-${{ matrix.label }}.zip" LEIA-ME.txt "Desinstalar Lex Calendário.command")

      - name: Instalador .pkg (assistente do macOS)
        working-directory: desktop
        run: |
          set -e
          V="${VERSION#v}"
          ARCH=${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
          mkdir -p out/pkgroot out/pkgs
          ditto "out/mac/Lex Calendário.app" "out/pkgroot/LexCalendario.app"
          pkgbuild --analyze --root out/pkgroot out/componente.plist
          plutil -replace 0.BundleIsRelocatable -bool NO out/componente.plist
          pkgbuild --root out/pkgroot --component-plist out/componente.plist \
            --identifier br.adv.caao.lexcalendario.pkg --version "$V" \
            --install-location /private/tmp/lex-calendario-instalador \
            --scripts packaging/macos-pkg/scripts out/pkgs/lex-calendario-componente.pkg
          sed -e "s/__VERSION__/$V/" -e "s/__ARCH__/$ARCH/" packaging/macos-pkg/Distribution.xml > out/Distribution.xml
          productbuild --distribution out/Distribution.xml --resources packaging/macos-pkg/resources \
            --package-path out/pkgs "../LexCalendario-Instalador-macOS-${{ matrix.label }}.pkg"

      - name: Testar o instalador .pkg
        if: matrix.arch == 'arm64'
        run: |
          set -e
          sudo installer -pkg LexCalendario-Instalador-macOS-${{ matrix.label }}.pkg -target / -verboseR
          cat /private/tmp/lex-calendario-instalador.log 2>/dev/null || true
          M="/Applications/Lex Calendário.app/Contents/Resources/.lex-instalado"
          test -f "$M" || M="$HOME/Applications/Lex Calendário.app/Contents/Resources/.lex-instalado"
          test "$(cat "$M")" = "${VERSION#v}"
          test ! -e /private/tmp/lex-calendario-instalador
          echo "Instalado: $(cat "$M")"

      - name: Enviar instalador para a release
        run: gh release upload "$VERSION" "LexCalendario-macOS-${{ matrix.label }}.zip" "LexCalendario-Instalador-macOS-${{ matrix.label }}.pkg" --clobber

  publish:
    name: Publicar release
    needs: [windows-linux, windows-installer, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publicar
        run: |
          set -e
          gh release delete-asset "$VERSION" payload-app.tar.gz -y || true
          cat > notas.md <<'NOTAS'
          ## Downloads — Avançar, Avançar, Concluir

          | Sistema | Instalador |
          |---|---|
          | 🪟 Windows 10/11 | `LexCalendario-Instalador-Windows.exe` |
          | 🍎 macOS (M1/M2/M3/M4) | `LexCalendario-Instalador-macOS-AppleSilicon.pkg` |
          | 🍎 macOS (Intel) | `LexCalendario-Instalador-macOS-Intel.pkg` |
          | 🐧 Linux (Ubuntu, Debian, Mint) | `LexCalendario-Instalador-Linux.deb` |

          Dê dois cliques no instalador e siga o assistente. Se já houver uma versão instalada, ela é atualizada e os dados são mantidos.

          **Windows:** se aparecer "O Windows protegeu o computador", clique em *Mais informações* → *Executar assim mesmo*.
          **macOS:** se o Mac disser que o desenvolvedor não foi identificado, abra *Ajustes do Sistema → Privacidade e Segurança* e clique em *Abrir Mesmo Assim*.

          Pacotes compactados (alternativa, também aceitos em Configurações → Aplicativo): `LexCalendario-Windows.zip`, `LexCalendario-macOS-*.zip`, `LexCalendario-Linux.tar.gz`.
          NOTAS
          gh release edit "$VERSION" --draft=false --latest --title "Lex Calendário $VERSION" --notes-file notas.md
